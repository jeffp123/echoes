<svg viewBox="0 0 1034 1034" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" style="margin: auto; border-radius: 22.5%;">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Echoes app icon — symmetrical ripples</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Perfectly concentric rings radiating from a central drop on deep navy, like a sound echo and a water ripple at once</desc>

  <defs>
    <radialGradient id="bg" cx="48%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#162535"/>
      <stop offset="100%" stop-color="#070D16"/>
    </radialGradient>
    <radialGradient id="drop" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2ECC8"/>
      <stop offset="100%" stop-color="#C8B87A"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Ring 4 — outermost, cool seafoam, very faint -->
  <circle cx="512" cy="512" r="388" fill="none" stroke="#6AADA8" stroke-width="17" opacity="0.22" style="fill:none;stroke:rgb(106, 173, 168);color:rgb(255, 255, 255);stroke-width:17px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.22;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Ring 3 — slightly warmer, more present -->
  <circle cx="512" cy="512" r="282" fill="none" stroke="#7EC4B8" stroke-width="20" opacity="0.38" style="fill:none;stroke:rgb(126, 196, 184);color:rgb(255, 255, 255);stroke-width:20px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.38;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Ring 2 — warm teal-white, clearly visible -->
  <circle cx="512" cy="512" r="188" fill="none" stroke="#A8D4C0" stroke-width="21" opacity="0.58" style="fill:none;stroke:rgb(168, 212, 192);color:rgb(255, 255, 255);stroke-width:21px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.58;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Ring 1 — innermost arc, warm pale gold, strong -->
  <circle cx="512" cy="512" r="106" fill="none" stroke="#D6D4A2" stroke-width="22" opacity="0.80" style="fill:none;stroke:rgb(214, 212, 162);color:rgb(255, 255, 255);stroke-width:22px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- The drop — luminous warm center -->
  <circle cx="512" cy="512" r="24" fill="url(#drop)" opacity="0.95" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.95;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Subtle inner glow ring around drop -->
  <circle cx="512" cy="512" r="34" fill="none" stroke="#EDE8C0" stroke-width="5" opacity="0.30" style="fill:none;stroke:rgb(237, 232, 192);color:rgb(255, 255, 255);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>